<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/logo/Simbolo_SafeControl.png" type="image/x-icon">
    <title>SafeControl | Dashboard</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body onload="ativarButtons()">
    <!-- Menu fixo de navegação -->

    <div class="menu-lateral">

        <a href="./dashboard.html">
            <img class="img-logo" src="../assets/logo/Logo_SafeControl_Vertical.png" alt="Logo SafeControl">
        </a>

        <div class="perfil">
            <h6 style="color: #13131a; font-weight: 700;">Olá, <span id="b_usuario">usuário</span>!</h6>
        </div>

        <button id="btn-ativo" class="button-menu" onclick="mostrar_visao_geral()">Visão Geral</button>

        <button class="button-menu" onclick="mostrar_sensor()">Sensores</button>

        <button class="button-menu" onclick="mostrar_perfil()">Perfil</button>

        <button class="btn-login" onclick="sair()"> Sair </button>
    </div>

    <div class="container-main">
        <!-- Div da página dos sensores -->
        <div id="div_sensores">
            <div class="container div_texto">
                <h1>Sensores</h1>
                <p>Confira com detalhes os seus sensores!</p>
            </div>
            <!-- DIV das KPIS -->
            <div class="container div_body">
                <!-- KPI Sensor 1 -->
                <div class="kpi-card">
                    <div class="kpi-info" id="kpi_sensor_1">
                        <span class="kpi-title">Escolha o sensor</span>
                        <h2 class="kpi-value"> Sensor 1</h2>
                        <span class="kpi-change positivo">Sensor ativo</span>
                    </div>
                </div>
                <!-- KPI Sensor 2 -->
                <div class="kpi-card">
                    <div class="kpi-info" id="kpi_sensor_2">
                        <span class="kpi-title">Escolha o sensor</span>
                        <h2 class="kpi-value"> Sensor 2</h2>
                        <span class="kpi-change positivo">Sensor ativo</span>
                    </div>
                </div>
                <!-- KPI Sensor 3 -->
                <div class="kpi-card negativo">
                    <div class="kpi-info">
                        <span class="kpi-title">Escolha o sensor</span>
                        <h2 class="kpi-value"> Sensor 3</h2>
                        <span class="kpi-change negativo">Sensor desativado</span>
                    </div>
                </div>
                <!-- KPI Sensor 4 -->
                <div class="kpi-card negativo">
                    <div class="kpi-info">
                        <span class="kpi-title">Escolha o sensor</span>
                        <h2 class="kpi-value"> Sensor 4</h2>
                        <span class="kpi-change negativo">Sensor desativado</span>
                    </div>
                </div>
            </div>
            <!-- Barra de navegação entre tabelas -->
            <div class="container">
                <div class="agrupar" id="sensor_1">
                    <button class="button_dash" id="sensor_temp2" onclick="ocultar_umid2()"><b>Gráfico
                            Temperatura</b></button>
                    <button class="button_dash" id="sensor_umid" onclick="ocultar_temp2()"><b>Gráfico
                            Umidade</b></button>
                </div>
            </div>
            <!-- Gráfico Temperatura -->
            <div class="container" id="temperatura2">
                <div class="grafico">
                    <canvas id="meuGrafico3"></canvas>
                </div>

            </div>
            <!-- Gráfico Umidade -->
            <div class="container div_chart" id="umidade2">
                <div class="grafico_linha">
                    <canvas id="meuGrafico4"></canvas>
                </div>

            </div>
        </div>

        <!-- Div da página de perfil -->
        <div id="div_perfil">
            <div class="container div_texto">
                <h1>Perfil</h1>
                <p>Confira os seus dados cadastrados!</p>
            </div>

            <div class="container card-cliente">
                <!-- TOPO COM FOTO -->
                <div class="card-header">
                    <div class="foto-perfil">
                        <img src="./imagens/icone_perfil.png" alt="Foto do cliente">
                    </div>
                </div>

                <!-- DADOS -->
                <div class="campo">
                    <label>Nome Completo</label>
                    <input type="text" value="Carlos Eduardo Martins">
                </div>

                <div class="campo">
                    <label>Email</label>
                    <input type="email" value="carlos.martins@safecontrol.com">
                </div>

                <div class="campo">
                    <label>CPF</label>
                    <input type="text" value="527.894.163-08">
                </div>

                <div class="campo">
                    <label>Telefone</label>
                    <input type="text" value="(11) 98765-4321">
                </div>

                <div class="campo">
                    <label>Empresa</label>
                    <input type="text" value="SafeControl LTDA">
                </div>

                <!-- BOTÕES -->
                <div class="card-footer">
                    <button class="btn-editar" onclick="habilitarEdicao()">Alterar Dados</button>
                    <button class="btn-salvar" onclick="salvarEdicao()">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<script>

    // CHAMADAS DOS ELEMENTOS PRESENTES NO CORPO DO HTML
    const temperatura2 = document.getElementById("temperatura2");
    const umidade2 = document.getElementById("umidade2");

    const div_sensores = document.getElementById("div_sensores");
    const div_perfil = document.getElementById("div_perfil");

    const button_inicial = document.getElementById("sensor_temp2");

    // CONFIGURAÇÕES INICIAIS
    div_perfil.style.display = "none";
    umidade2.style.display = "none";

    button_inicial.focus();

    // EXIBIR PÁGINA PRINCIPAL
    function mostrar_visao_geral() {
        window.location.href='./dashboard.html';
    }

    // EXIBIR PÁGINA DE SENSORES
    function mostrar_sensor() {
        window.location.href='./sensores.html';
    }

    // EXIBIR PÁGINA DE PERFIL
    function mostrar_perfil() {
        window.location.href='./perfil.html';
    }

    // ALTERNAR ENTRE OS GRÁFICOS
    function ocultar_umid2() {
        temperatura2.style.display = "flex";
        umidade2.style.display = "none";
    }

    function ocultar_temp2() {
        umidade2.style.display = "flex";
        temperatura2.style.display = "none";
    }

    // VARIÁVEIS QUE PUXAM O ID DO HTML PARA SEREM REFERENCIADOS NO JS
    const ctx3 = document.getElementById('meuGrafico3');
    const ctx4 = document.getElementById('meuGrafico4');

    // GRAFICO 3 - TEMPERATURA
    const grafico3 = new Chart(ctx3, {
        type: 'line',
        data: {
            labels: ['05/05: 12:00', '05/05: 13:00', '05/05: 14:00', '05/05: 15:00', '05/05: 16:00', '05/05: 17:00', '05/05: 18:00', '05/05: 19:00', '05/05: 20:00', '05/05: 21:00'],
            datasets: [{
                label: '  Temperatura Atual',
                data: [],
                borderColor: '#4facfe',
                backgroundColor: 'rgba(79, 172, 254, 0.15)',
                borderWidth: 3,
                pointBackgroundColor: '#4facfe',
                pointBorderWidth: 4,
                pointBorderColor: '#4facfe'
            },
            {
                label: 'Máxima',
                data: ['4', '4', '4', '4', '4', '4', '4', '4', '4', '4'],
                borderColor: 'red',
                borderWidth: 2,
                pointRadius: 0
            },
            {
                label: 'Mínima',
                data: ['-4', '-4', '-4', '-4', '-4', '-4', '-4', '-4', '-4', '-4'],
                borderColor: 'blue',
                borderWidth: 2,
                pointRadius: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    min: -8,
                    max: 8
                }
            },
            animation: {
                duration: 500,
                easing: 'easeInOutCubic'
            }
        }
    });

    // CONFIGURAÇÃO DE ATUALIZAÇÃO DO GRAFICO 3
    setInterval(() => {
        const novoValor = Number((Math.random() * (6 - (-6)) + (-6)).toFixed());

        grafico3.data.datasets[0].data.push(novoValor);

        // SHIFT DO GRÁFICO
        if (grafico3.data.datasets[0].data.length > 10) {
            grafico3.data.datasets[0].data.shift();
        }
        // VARIAÇÃO QUE ALTERA A COR DA LINHA CASO TENHA ULTRAPASSADO O MÁXIMO
        if (novoValor > 4) {
            grafico3.data.datasets[0].borderColor = '#ff4d4f';
            grafico3.data.datasets[0].pointBorderColor = '#ff4d4f';
        } else {
            grafico3.data.datasets[0].borderColor = '#4facfe';
            grafico3.data.datasets[0].pointBorderColor = '#4facfe';
        }

        grafico3.update();

    }, 1100);

    // GRAFICO 4 - UMIDADE
    const grafico4 = new Chart(ctx4, {
        type: 'bar',
        data: {
            labels: ['05/05: 12:00', '05/05: 13:00', '05/05: 14:00', '05/05: 15:00', '05/05: 16:00', '05/05: 17:00', '05/05: 18:00', '05/05: 19:00', '05/05: 20:00', '05/05: 21:00'],
            datasets: [
                {
                    label: 'Máxima',
                    data: ['85', '85', '85', '85', '85', '85', '85', '85', '85', '85'],
                    backgroundColor: '#535353'
                },
                {
                    label: 'Umidade Atual',
                    data: [],
                    backgroundColor: 'rgba(79, 172, 254)',
                },
                {
                    label: 'Mínima',
                    data: ['70', '70', '70', '70', '70', '70', '70', '70', '70', '70'],
                    backgroundColor: '#888'
                }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    min: 50,
                    max: 100
                }
            },
            animation: {
                duration: 500,
                easing: 'easeInOutCubic'
            }
        }
    });

    // CONFIGURAÇÃO DE ATUALIZAÇÃO DO GRAFICO 4
    setInterval(() => {
        const novoValor4 = Number((Math.random() * (90 - 65) + 65).toFixed());

        grafico4.data.datasets[1].data.push(novoValor4);

        // SHIFT DO GRÁFICO
        if (grafico4.data.datasets[1].data.length > 10) {
            grafico4.data.datasets[1].data.shift();
        }
        // VARIAÇÃO QUE ALTERA A COR DA LINHA CASO TENHA ULTRAPASSADO O MÁXIMO
        if (novoValor4 < 70 || novoValor4 > 85) {
            grafico4.data.datasets[1].backgroundColor = '#ff4d4f';
        } else {
            grafico4.data.datasets[1].backgroundColor = '#4facfe';
        }

        grafico4.update();
    }, 1100);

    function ativarButtons() {
        let btn_graf = document.getElementById("btn-ativo");
        let btn_menu = document.getElementById("sensor_temp");

        btn_graf.focus;
        btn_menu.focus;
    }

</script>
